<div class="min-h-[75vh] flex items-center justify-center">
  <div class="card bg-base-100 shadow-md w-full max-w-sm">
    <form class="card-body gap-3" (submit)="login(); $event.preventDefault()">
      <div class="flex flex-col items-center text-center gap-2 mb-2">
        <img src="logo.svg" alt="โลโก้ส่งด่วนมื้อเที่ยง" class="w-16 h-16 -rotate-6" />
        <h1 class="font-display text-2xl">เข้าสู่ระบบ</h1>
        <p class="text-sm text-base-content/70">เจ้าของร้าน และไรเดอร์ ใช้เบอร์โทรกับรหัสผ่าน</p>
      </div>

      <label class="input outline-0 w-full">
        <fa-icon [icon]="faPhone" class="opacity-50"></fa-icon>
        <input type="tel" name="phone" placeholder="เบอร์โทร" autocomplete="username" [(ngModel)]="phone" />
      </label>

      <label class="input outline-0 w-full">
        <fa-icon [icon]="faLock" class="opacity-50"></fa-icon>
        <input
          type="password"
          name="password"
          placeholder="รหัสผ่าน"
          autocomplete="current-password"
          [(ngModel)]="password"
        />
      </label>

      @if (errorMessage()) {
        <div role="alert" class="alert alert-error text-sm py-2">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-primary w-full mt-1" [disabled]="loading()">
        @if (loading()) {
          <span class="loading loading-spinner loading-sm"></span>
        }
        เข้าสู่ระบบ
      </button>
    </form>
  </div>
</div>
