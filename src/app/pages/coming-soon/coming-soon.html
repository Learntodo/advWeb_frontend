<section class="rounded-box bg-neutral text-neutral-content p-5 sm:p-7 mb-6">
  <p class="text-sm opacity-70">ส่วนที่เตรียมไว้แล้ว</p>
  <h1 class="font-display text-3xl sm:text-4xl text-secondary mt-1">
    <fa-icon [icon]="faHammer"></fa-icon> กำลังพัฒนา
  </h1>
  <p class="mt-3 opacity-80">
    ตอนนี้ระบบใช้งานได้ครบในส่วนลูกค้าและออเดอร์ ส่วนด้านล่างวางโครงไว้แล้ว รอเชื่อมกับ Web API รอบถัดไป
  </p>
</section>

<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  @for (f of features(); track f.title) {
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body p-5 gap-2">
        <div class="flex items-center gap-3">
          <span class="grid place-items-center w-10 h-10 rounded-lg bg-primary/10 text-primary">
            <fa-icon [icon]="f.icon"></fa-icon>
          </span>
          <h2 class="font-display text-lg flex-1">{{ f.title }}</h2>
        </div>
        <p class="text-sm text-base-content/70">{{ f.detail }}</p>
        <span class="badge badge-warning badge-sm">เร็ว ๆ นี้</span>
      </div>
    </div>
  }
</div>

<div class="mt-6">
  <a routerLink="/" class="btn btn-ghost">กลับหน้าภาพรวม</a>
</div>
