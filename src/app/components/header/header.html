<header class="bg-neutral text-neutral-content shadow-md sticky top-0 z-[1000]">
  <div class="navbar max-w-7xl mx-auto px-3 sm:px-6 min-h-16">
    <div class="navbar-start gap-1">
      <!-- เมนูมือถือ -->
      <div class="dropdown lg:hidden">
        <button
          tabindex="0"
          class="btn btn-ghost btn-square text-neutral-content hover:bg-neutral-content/10"
          aria-label="เมนู"
        >
          <fa-icon [icon]="faBars" size="lg"></fa-icon>
        </button>
        <ul
          tabindex="0"
          class="menu dropdown-content bg-base-100 text-base-content rounded-box z-10 mt-3 w-56 p-2 shadow-lg"
        >
          @for (menu of menus; track menu.path) {
            <li>
              <a
                [routerLink]="menu.path"
                routerLinkActive="menu-active"
                [routerLinkActiveOptions]="{ exact: menu.exact }"
              >
                <fa-icon [icon]="menu.icon" class="w-4"></fa-icon>{{ menu.label }}
              </a>
            </li>
          }
        </ul>
      </div>

      <a routerLink="/" class="flex items-center gap-3">
        <span class="grid place-items-center w-10 h-10 rounded-lg bg-secondary text-secondary-content -rotate-6">
          <fa-icon [icon]="faMotorcycle" size="lg"></fa-icon>
        </span>
        <span class="leading-tight">
          <span class="block font-display text-lg sm:text-xl text-secondary whitespace-nowrap">ส่งด่วนมื้อเที่ยง</span>
          <span class="hidden sm:block text-xs opacity-70">ระบบหลังร้าน</span>
        </span>
      </a>
    </div>

    <nav class="navbar-end hidden lg:flex">
      <ul class="menu menu-horizontal gap-1 px-1">
        @for (menu of menus; track menu.path) {
          <li>
            <a
              [routerLink]="menu.path"
              routerLinkActive="!bg-secondary !text-secondary-content"
              [routerLinkActiveOptions]="{ exact: menu.exact }"
              class="rounded-lg"
            >
              <fa-icon [icon]="menu.icon"></fa-icon>{{ menu.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
