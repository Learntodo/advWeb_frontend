<div class="modal modal-open" role="dialog">
  <div class="modal-box max-w-sm">
    <div class="flex items-center justify-between">
      <h3 class="font-display text-xl">เปลี่ยนรหัสผ่าน</h3>
      <button class="btn btn-sm btn-circle btn-ghost" (click)="closed.emit()">
        <fa-icon [icon]="faXmark"></fa-icon>
      </button>
    </div>

    <form class="mt-3" (submit)="save(); $event.preventDefault()">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">รหัสผ่านเดิม</legend>
        <input
          class="input outline-0 w-full"
          type="password"
          name="oldPassword"
          autocomplete="current-password"
          [(ngModel)]="oldPassword"
        />
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</legend>
        <input
          class="input outline-0 w-full"
          type="password"
          name="newPassword"
          autocomplete="new-password"
          [(ngModel)]="newPassword"
        />
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">ยืนยันรหัสผ่านใหม่</legend>
        <input
          class="input outline-0 w-full"
          type="password"
          name="confirmPassword"
          autocomplete="new-password"
          [(ngModel)]="confirmPassword"
        />
      </fieldset>

      @if (errorMessage()) {
        <div role="alert" class="alert alert-error text-sm py-2 mt-3">{{ errorMessage() }}</div>
      }

      <div class="flex justify-end gap-2 pt-4">
        <button type="button" class="btn btn-ghost" (click)="closed.emit()">ยกเลิก</button>
        <button type="submit" class="btn btn-primary min-w-28" [disabled]="saving()">
          @if (saving()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          บันทึก
        </button>
      </div>
    </form>
  </div>
  <div class="modal-backdrop" (click)="closed.emit()"></div>
</div>
