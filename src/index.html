<!doctype html>
<html lang="th" data-theme="lunchbox">
  <head>
    <meta charset="utf-8" />
    <title>ส่งด่วนมื้อเที่ยง | ระบบหลังร้าน</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- ใช้ธีมที่ผู้ใช้เลือกไว้ (สว่าง / มืด) ตั้งแต่ก่อนหน้าเว็บโหลด จะได้ไม่กระพริบ -->
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'lunchbox-dark');
      }
    </script>
  </head>
  <body class="bg-base-200 min-h-screen">
    <app-root></app-root>
  </body>
</html>
